# Render Blueprint for Freshman Academy (freshform).
# Deploy: Render dashboard → New → Blueprint → point at this repo.
#
# This is a stateful Node web service: it stores data in a SQLite file on a
# persistent disk, so it runs as a SINGLE instance (SQLite is single-writer).
services:
  - type: web
    name: freshform
    runtime: node
    plan: starter # required — persistent disks are not available on Free
    numInstances: 1 # must stay 1: SQLite cannot be shared across instances

    # Deploys are MANUAL (Render dashboard → Manual Deploy). main is pushed to
    # continuously during the redesign and must not go live on every commit;
    # deploy a commit deliberately once it has been clicked through locally.
    autoDeploy: false

    # Use `npm install`, not `npm ci`: the lockfile is generated on macOS and
    # omits Linux-only optional deps (@emnapi/*, wasm fallbacks for Tailwind's
    # native oxide), which makes strict `npm ci` fail on Render's Linux build.
    # devDependencies (typescript, tailwind, tsx) are needed to build and to
    # run the seed, so force-install them even though Render sets production.
    buildCommand: npm install --include=dev && npm run build
    # Apply migrations, then start. `db:migrate:safe` is `prisma migrate deploy`
    # with a safety net (scripts/migrate-deploy.mjs): when a migration is
    # pending it copies the SQLite file first (VACUUM INTO, newest 5 kept beside
    # it), and if the migration fails it exits non-zero so the deploy stops
    # before new code meets a half-migrated database. Nothing pending = no-op.
    # The seed is NOT run here any more.
    #
    # It was, on every boot, and that was load-bearing while staff lived in
    # config/app-config.ts. It stopped being safe the moment access became
    # rows: a seed that runs on every restart is a seed that can undo a
    # decision somebody made on /settings/platform, and "it came back after the
    # next deploy" is the worst way to learn your permission model has a second
    # writer. The seed still exists for a fresh database — `npm run db:seed`,
    # by hand, once.
    startCommand: npm run db:migrate:safe && npm start

    # Persistent storage for the SQLite database. Wiped-on-deploy without this.
    disk:
      name: freshform-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        value: file:/data/app.db
      # Set after the first deploy, once you know the service URL:
      #   https://<your-service>.onrender.com
      - key: NEXTAUTH_URL
        sync: false
      # Render generates a strong secret on first deploy.
      - key: NEXTAUTH_SECRET
        generateValue: true
      # Shared with the cron job below; guards /api/cron/* endpoints.
      - key: CRON_SECRET
        generateValue: true
      # From Google Cloud console → APIs & Services → Credentials.
      # Add redirect URI: <NEXTAUTH_URL>/api/auth/callback/google
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Outbound email (the weekly hours digest). Until BOTH are set the digest
      # still runs and logs what it would have sent, so nothing breaks before
      # the sending domain is verified — the cron response reports live: false.
      #   RESEND_API_KEY  from resend.com → API Keys
      #   EMAIL_FROM      e.g. "Freshman Academy <hours@freshlog.net>"; the
      #                   domain needs SPF + DKIM records added at Resend first
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Dictated session notes. Until this is set the mic button does not
      # render and logging a session is unchanged.
      - key: OPENROUTER_API_KEY
        sync: false
      # Bug reports from the Telegram group (lib/telegram.ts). Off until all
      # three are set; .env.example has the setup steps.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Google Meet drafts. Until all three are set the Settings row does not
      # render and the meet-sync cron below reads nobody. A separate, Internal
      # OAuth client from sign-in — see .env.example.
      #   Add redirect URI: <NEXTAUTH_URL>/api/google/callback
      - key: GOOGLE_CONNECT_CLIENT_ID
        sync: false
      - key: GOOGLE_CONNECT_CLIENT_SECRET
        sync: false
      #   openssl rand -base64 32 — encrypts the stored Google tokens
      - key: GOOGLE_TOKEN_KEY
        sync: false

  # Daily deadline reminders. The SQLite disk belongs to the web service, so
  # the cron job can't touch the database directly — it calls the app's
  # authenticated cron endpoint instead and the web service does the work.
  # 04:00 UTC = 09:00 in Tashkent.
  - type: cron
    name: freshform-deadline-reminders
    runtime: node
    plan: starter
    schedule: "0 4 * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsSL --retry 3 --retry-delay 10
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/deadline-reminders"
    envVars:
      # NOTE: do NOT use `property: host` here — it returns the service's INTERNAL
      # private-network hostname (e.g. "freshform-srma"), which has no public TLS
      # listener, so curl to https://<that>:443 fails with "couldn't connect".
      # Use the public custom domain directly.
      # MUST be the canonical host. Cloudflare 301s the apex to www, and the
      # curl below had no --location: it printed the redirect body and exited
      # 0, so Render recorded a successful run every day while the endpoint
      # was never called. --location is now set too, as a tripwire — a future
      # redirect would strip the bearer and fail loudly with 401 instead.
      - key: APP_URL
        value: "https://www.freshlog.net"
      - key: CRON_SECRET
        fromService:
          type: web
          name: freshform
          envVarKey: CRON_SECRET

  # Daily copy of the database onto the same disk (kept 30 days) — see
  # src/lib/db-backup.ts and scripts/restore-backup.mjs. Same arrangement as
  # the jobs around it: the cron calls the web service, which owns the disk.
  # 02:00 UTC = 07:00 in Tashkent, before the working day.
  - type: cron
    name: freshform-db-backup
    runtime: node
    plan: starter
    schedule: "0 2 * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsSL --retry 3 --retry-delay 10
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/db-backup"
    envVars:
      - key: APP_URL
        value: "https://www.freshlog.net"
      - key: CRON_SECRET
        fromService:
          type: web
          name: freshform
          envVarKey: CRON_SECRET

  # Google Meet calls turned into drafts the mentor confirms — see
  # src/lib/meet-sync.ts. Every ten minutes, so a meeting is waiting in Needs
  # you soon after it ends. Same arrangement as the jobs around it: the cron
  # calls the web service, which owns the SQLite disk. A no-op that answers
  # `configured: false` until the GOOGLE_CONNECT_* and GOOGLE_TOKEN_KEY
  # variables are set on the web service.
  - type: cron
    name: freshform-meet-sync
    runtime: node
    plan: starter
    schedule: "*/10 * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsSL --retry 3 --retry-delay 10
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/meet-sync"
    envVars:
      # MUST be the canonical host — see the deadline reminders above.
      - key: APP_URL
        value: "https://www.freshlog.net"
      - key: CRON_SECRET
        fromService:
          type: web
          name: freshform
          envVarKey: CRON_SECRET

  # The freshlog app's pushes: every minute, the notices nobody has dealt with
  # yet go to the readers' phones through Expo's push service. Same arrangement
  # as the reminders above. EXPO_ACCESS_TOKEN, when the Expo project requires
  # one, is the web service's to hold, not this job's.
  - type: cron
    name: freshform-push
    runtime: node
    plan: starter
    schedule: "* * * * *"
    buildCommand: "true"
    startCommand: >-
      curl -fsSL --retry 2 --retry-delay 5
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/push"
    envVars:
      # MUST be the canonical host — see the deadline reminders above.
      - key: APP_URL
        value: "https://www.freshlog.net"
      - key: CRON_SECRET
        fromService:
          type: web
          name: freshform
          envVarKey: CRON_SECRET

  # The weekly hours email: what each person redeemed last week, what is still
  # theirs to redeem, and when it expires. Same arrangement as the reminders
  # above — the cron calls the web service, which owns the SQLite disk.
  # 04:00 UTC Monday = 09:00 Monday in Tashkent.
  - type: cron
    name: freshform-weekly-digest
    runtime: node
    plan: starter
    schedule: "0 4 * * 1"
    buildCommand: "true"
    startCommand: >-
      curl -fsSL --retry 3 --retry-delay 10
      -H "Authorization: Bearer $CRON_SECRET"
      "$APP_URL/api/cron/weekly-digest"
    envVars:
      # MUST be the canonical host. Cloudflare 301s the apex to www, and the
      # curl below had no --location: it printed the redirect body and exited
      # 0, so Render recorded a successful run every day while the endpoint
      # was never called. --location is now set too, as a tripwire — a future
      # redirect would strip the bearer and fail loudly with 401 instead.
      - key: APP_URL
        value: "https://www.freshlog.net"
      - key: CRON_SECRET
        fromService:
          type: web
          name: freshform
          envVarKey: CRON_SECRET
